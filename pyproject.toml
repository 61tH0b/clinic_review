[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinic-review"
version = "0.1.0"
description = "Panel-wide screening and care-gap review for a BC family practice on TELUS CHR"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.56",
    "pyyaml>=6",
    "cryptography>=41",
]

[project.optional-dependencies]
# macOS Keychain holds the store key on the clinic Mac
mac = ["keyring>=25"]
dev = ["pytest>=8"]

[project.scripts]
clinic-review-walker = "clinic_review.walker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: drives a real Chromium through Playwright"]
